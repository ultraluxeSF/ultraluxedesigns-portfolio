name: Copy images from the old site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mirror-images.mjs
      - run: node scripts/build.mjs
      - name: Commit images and rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images index.html work
          git diff --cached --quiet || git commit -m "Copy portfolio images into the repository"
          git push
